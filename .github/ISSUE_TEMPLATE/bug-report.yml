name: Bug report
description: Something in KitNote crashes or does not work as described.
type: Bug
labels: ["bug"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: KitNote version
      description: Help > About KitNote (Windows) or KitNote > About KitNote (macOS). For example `1.0.0`.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Crash or freeze
        - Opening, saving or importing a file
        - Exporting (PDF, PNG, SVG, MIDI, MusicXML, audio, text tab)
        - Playback sound
        - Notation or engraving
        - Drum commands (patterns, rudiments, step grid, sticking, drum tab)
        - Recording to drum score (audio engine)
        - AI tools (MCP server, skill, Preferences > AI)
        - Installer or uninstaller
        - Something else
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, step by step, from starting KitNote.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files and screenshots
      description: A score that shows the problem (zip it if it is a folder or several files), and a screenshot or short recording if that helps. Do not post private recordings or songs you do not own the rights to.
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Other information that may help, such as the crash message or the output of the command you ran.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues for this problem.
          required: true
        - label: I used the latest release, or I say which version I used above.
          required: true
