name: 'Build: Windows'

# Builds KitNote for Windows x64, runs KitNote's own checks and packs the zip.
# The build options are the ones in tools/kitnote/build_windows.bat: keep the two in step.
# release.yml calls this workflow; it needs no inputs except full_tests.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_tests:
        description: 'Also run tools/kitnote/stress_test.py (about seven minutes)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      full_tests:
        description: 'Also run tools/kitnote/stress_test.py (about seven minutes)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows_x64:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Qt 6.10.2 with aqtinstall
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.10.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qt5compat qtnetworkauth qtshadertools qtwebsockets'
          dir: '${{ runner.temp }}/Qt'
          setup-python: 'false'
          cache: true

      - name: Set up the Visual Studio C++ environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Put Qt and Ninja on PATH
        shell: pwsh
        run: |
          $qt = Join-Path $env:RUNNER_TEMP 'Qt\6.10.2\msvc2022_64'
          if (-not (Test-Path (Join-Path $qt 'bin\qmake.exe'))) {
            throw "Qt 6.10.2 was not found at $qt"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "QT_DIR=$qt"
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $qt 'bin')

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($vs) {
            # Visual Studio ships Ninja; the runner may not have it on PATH.
            $ninja = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja'
            if (Test-Path (Join-Path $ninja 'ninja.exe')) {
              Add-Content -Path $env:GITHUB_PATH -Value $ninja
            }
          }

      - name: Check the tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in cmake ninja cl windeployqt lrelease python; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool is not on PATH"
              exit 1
            fi
          done
          cmake --version | head -n 1
          ninja --version
          python --version
          test -n "${QT_DIR:-}"

      - name: Make the drum SoundFont
        shell: bash
        env:
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          python tools/kitnote/make_drum_soundfont.py "share/sound/MS Basic.sf3" "share/sound/KitNote Drums.sf3"
          test -s "share/sound/KitNote Drums.sf3"

      - name: Register the MSVC problem matcher
        run: echo "::add-matcher::.github/problem_matchers/msvc.json"

      - name: Build and install
        shell: bash
        env:
          KITNOTE_APP_BUILD_MODE: release
          KITNOTE_RUN_WINDEPLOYQT: ON
        run: |
          set -euo pipefail
          export CMAKE_PREFIX_PATH="$(cygpath -m "$QT_DIR")"
          export KITNOTE_REVISION="$(git rev-parse --short HEAD)"
          export KITNOTE_BUILD_NUMBER="$(date -u +%y%m%d)"
          bash ./ninja_build.sh -t install
          test -f build.install/bin/KitNote.exe
          test -f build.install/bin/kitnote-mcp.exe

      - name: Install the test requirements
        shell: bash
        run: python -m pip install --upgrade pip numpy scipy

      - name: KitNote checks from the command line
        shell: bash
        env:
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          python tools/kitnote/smoke_test.py
          python tools/kitnote/mcp_test.py
          python tools/kitnote/test_audio_chart.py

      - name: Installer checks
        shell: pwsh
        run: |
          # test_install.ps1 reports failures as FAIL lines and does not set an exit code for them.
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File tools\kitnote\test_install.ps1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0 -or $out -match '(?m)^FAIL') {
            throw 'test_install.ps1 reported a failure'
          }

      - name: Longer checks
        if: ${{ inputs.full_tests }}
        shell: bash
        env:
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          python tools/kitnote/stress_test.py

      - name: Package the zip
        shell: bash
        run: |
          set -euo pipefail
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/kitnote/package_windows.ps1
          ls -l dist/

      - name: Upload the Windows package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: KitNote-windows
          path: dist/KitNote-*-win64.zip
          if-no-files-found: error
          retention-days: 30
